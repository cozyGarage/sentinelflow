name: SentinelFlow Security Scan
description: Run SentinelFlow security scanning in your CI/CD pipeline
author: SentinelFlow

branding:
  icon: shield
  color: blue

inputs:
  delivery:
    description: How to obtain SentinelFlow — release (download GitHub Release binary + checksums, recommended for external repos), docker (pull image), or build (compile from caller workspace; same-repo only)
    required: false
    default: release
  image:
    description: Container image when delivery=docker
    required: false
    default: sentinelflow/sentinelflow:v1.1.1
  version:
    description: Release tag when delivery=release (e.g. v1.1.1). Empty uses the action ref, then latest.
    required: false
    default: ''
  scan-all:
    description: "Enable secrets/iac/deps/sast (not container, not license, not artifacts). Set an individual scan-* input to false to opt out. Policy stays enabled when scan-all is true."
    required: false
    default: 'true'
  scan-secrets:
    description: Enable secret scanning
    required: false
    default: 'true'
  scan-iac:
    description: Enable Infrastructure-as-Code scanning
    required: false
    default: 'true'
  scan-deps:
    description: Enable dependency vulnerability scanning
    required: false
    default: 'true'
  scan-sast:
    description: Enable SAST scanning (OWASP patterns)
    required: false
    default: 'true'
  scan-license:
    description: "Opt-in license policy scanning (not included in scan-all / --all)"
    required: false
    default: 'false'
  scan-container:
    description: Enable container image scanning (requires Trivy)
    required: false
    default: 'false'
  scan-artifacts:
    description: "Opt-in artifact/binary scanning (not included in scan-all / --all)"
    required: false
    default: 'false'
  container-image:
    description: Container image reference to scan
    required: false
    default: ''
  use-baseline:
    description: Apply baseline filtering (.sentinelflow/baseline.yaml)
    required: false
    default: 'false'
  fail-on:
    description: Fail on findings at or above this severity (critical, high, medium, low)
    required: false
    default: high
  format:
    description: Report output format (text, json, sarif, markdown, html, junit, gitlab-sast, gitlab-deps)
    required: false
    default: sarif
  output:
    description: Output file path for the report
    required: false
    default: report.sarif
  working-directory:
    description: Directory to scan
    required: false
    default: '.'
  timeout:
    description: Scan deadline (Go duration, e.g. 10m, 90s); empty uses scan_timeout / default 10m
    required: false
    default: ''
  diff-base:
    description: Limit findings to files/lines changed since this git ref
    required: false
    default: ''
  emit-annotations:
    description: Print GitHub Actions workflow annotations for findings
    required: false
    default: 'false'

outputs:
  findings-count:
    description: Total number of findings (from scan summary)
    value: ${{ steps.scan.outputs.findings-count }}
  exit-code:
    description: Exit code from the scan step (0 pass, 1 gate, 2 tool error, 3 timeout)
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Setup Go
      if: inputs.delivery == 'build'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Build SentinelFlow
      if: inputs.delivery == 'build'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ ! -f go.mod ] || [ ! -d cmd/sentinelflow ]; then
          echo "delivery=build requires the SentinelFlow source tree in the workspace (same-repo dogfood)." >&2
          echo "For external repos use delivery=release (verifies checksums.txt) or delivery=docker with a published image tag." >&2
          exit 1
        fi
        go build -o sentinelflow ./cmd/sentinelflow
        ./sentinelflow version

    - name: Install SentinelFlow (release)
      if: inputs.delivery == 'release'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        SF_VERSION: ${{ inputs.version }}
        GITHUB_ACTION_REF: ${{ github.action_ref }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ref="${SF_VERSION:-}"
        if [ -z "$ref" ]; then
          ref="${GITHUB_ACTION_REF:-}"
        fi
        ref="${ref#refs/tags/}"
        ref="${ref#v}"
        case "$ref" in
          ""|main|master|HEAD|develop) VERSION="" ;;
          *) VERSION="$ref" ;;
        esac
        export VERSION
        export INSTALL_DIR="${RUNNER_TEMP}/sentinelflow-bin"
        mkdir -p "${INSTALL_DIR}"
        INSTALLER=""
        if [ -f "${GITHUB_ACTION_PATH}/scripts/install.sh" ]; then
          INSTALLER="${GITHUB_ACTION_PATH}/scripts/install.sh"
        elif [ -f "${GITHUB_ACTION_PATH}/../../../scripts/install.sh" ]; then
          INSTALLER="${GITHUB_ACTION_PATH}/../../../scripts/install.sh"
        fi
        if [ -n "${INSTALLER}" ]; then
          bash "${INSTALLER}"
        else
          curl -fsSL https://raw.githubusercontent.com/cozyGarage/sentielflow/main/scripts/install.sh | bash
        fi
        echo "SF_BIN=${INSTALL_DIR}/sentinelflow" >> "$GITHUB_ENV"

    - name: Pull SentinelFlow image
      if: inputs.delivery == 'docker'
      shell: bash
      env:
        SF_IMAGE: ${{ inputs.image }}
      run: |
        docker pull "${SF_IMAGE}"
        docker run --rm "${SF_IMAGE}" version

    - name: Install Trivy
      if: inputs.scan-container == 'true' && (inputs.delivery == 'build' || inputs.delivery == 'release')
      uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

    - name: Guard container+docker delivery
      if: inputs.scan-container == 'true' && inputs.delivery == 'docker'
      shell: bash
      run: |
        echo "scan-container requires delivery=build or delivery=release (Trivy runs on the host binary path)." >&2
        exit 1

    - name: Run security scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SF_DELIVERY: ${{ inputs.delivery }}
        SF_IMAGE: ${{ inputs.image }}
        SF_SCAN_ALL: ${{ inputs.scan-all }}
        SF_SCAN_SECRETS: ${{ inputs.scan-secrets }}
        SF_SCAN_IAC: ${{ inputs.scan-iac }}
        SF_SCAN_DEPS: ${{ inputs.scan-deps }}
        SF_SCAN_SAST: ${{ inputs.scan-sast }}
        SF_SCAN_LICENSE: ${{ inputs.scan-license }}
        SF_SCAN_CONTAINER: ${{ inputs.scan-container }}
        SF_SCAN_ARTIFACTS: ${{ inputs.scan-artifacts }}
        SF_CONTAINER_IMAGE: ${{ inputs.container-image }}
        SF_USE_BASELINE: ${{ inputs.use-baseline }}
        SF_FAIL_ON: ${{ inputs.fail-on }}
        SF_FORMAT: ${{ inputs.format }}
        SF_OUTPUT: ${{ inputs.output }}
        SF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SF_TIMEOUT: ${{ inputs.timeout }}
        SF_DIFF_BASE: ${{ inputs.diff-base }}
        SF_EMIT_ANNOTATIONS: ${{ inputs.emit-annotations }}
        SF_WORKSPACE: ${{ github.workspace }}
        SF_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ARGS=()
        # scan-all enables secrets/iac/deps/sast (not container, not license, not artifacts).
        # Individual scan-*: false inputs opt out via --no-* so policy stays on.
        # Selective flags (scan-all false) still disable policy, matching the CLI.
        # License and artifacts are opt-in only and are never implied by scan-all / --all.
        if [ "${SF_SCAN_ALL}" = "true" ]; then
          ARGS+=(--all)
          [ "${SF_SCAN_SECRETS}" = "false" ] && ARGS+=(--no-secrets)
          [ "${SF_SCAN_IAC}" = "false" ] && ARGS+=(--no-iac)
          [ "${SF_SCAN_DEPS}" = "false" ] && ARGS+=(--no-deps)
          [ "${SF_SCAN_SAST}" = "false" ] && ARGS+=(--no-sast)
        else
          [ "${SF_SCAN_SECRETS}" = "true" ] && ARGS+=(--secrets)
          [ "${SF_SCAN_IAC}" = "true" ] && ARGS+=(--iac)
          [ "${SF_SCAN_DEPS}" = "true" ] && ARGS+=(--deps)
          [ "${SF_SCAN_SAST}" = "true" ] && ARGS+=(--sast)
        fi
        [ "${SF_SCAN_LICENSE}" = "true" ] && ARGS+=(--license)
        [ "${SF_SCAN_ARTIFACTS}" = "true" ] && ARGS+=(--artifacts)

        if [ "${SF_SCAN_CONTAINER}" = "true" ]; then
          ARGS+=(--container)
          if [ -n "${SF_CONTAINER_IMAGE}" ]; then
            ARGS+=(--container-image "${SF_CONTAINER_IMAGE}")
          fi
        fi

        if [ "${SF_USE_BASELINE}" = "true" ]; then
          ARGS+=(--baseline)
        fi

        if [ -n "${SF_TIMEOUT}" ]; then
          ARGS+=(--timeout "${SF_TIMEOUT}")
        fi
        if [ -n "${SF_DIFF_BASE}" ]; then
          ARGS+=(--diff-base "${SF_DIFF_BASE}")
        fi
        if [ "${SF_EMIT_ANNOTATIONS}" = "true" ]; then
          ARGS+=(--emit-annotations)
        fi

        if [[ "${SF_OUTPUT}" = /* ]]; then
          OUT_PATH="${SF_OUTPUT}"
        else
          OUT_PATH="${SF_WORKSPACE}/${SF_OUTPUT}"
        fi
        if [[ "${SF_OUTPUT}" = /* ]]; then
          case "${SF_OUTPUT}" in
            "${SF_WORKSPACE}"/*) DOCKER_OUT="/workspace/${SF_OUTPUT#"${SF_WORKSPACE}"/}" ;;
            *) DOCKER_OUT="${SF_OUTPUT}" ;;
          esac
        else
          DOCKER_OUT="/workspace/${SF_OUTPUT}"
        fi
        WORK_DIR="${SF_WORKING_DIRECTORY}"
        if [ -z "${WORK_DIR}" ] || [ "${WORK_DIR}" = "." ]; then
          DOCKER_WORKDIR="/workspace"
        else
          DOCKER_WORKDIR="/workspace/${WORK_DIR}"
        fi

        set +e
        if [ "${SF_DELIVERY}" = "docker" ]; then
          docker run --rm \
            -v "${SF_WORKSPACE}:/workspace" \
            -w "${DOCKER_WORKDIR}" \
            "${SF_IMAGE}" \
            scan "${ARGS[@]}" \
              --fail-on "${SF_FAIL_ON}" \
              --format "${SF_FORMAT}" \
              -o "${DOCKER_OUT}"
          EXIT_CODE=$?
        else
          if [ "${SF_DELIVERY}" = "build" ]; then
            SF="${SF_WORKSPACE}/sentinelflow"
          else
            SF="${SF_BIN:-${RUNNER_TEMP}/sentinelflow-bin/sentinelflow}"
          fi
          "$SF" scan "${ARGS[@]}" \
            --fail-on "${SF_FAIL_ON}" \
            --format "${SF_FORMAT}" \
            -o "${OUT_PATH}"
          EXIT_CODE=$?
        fi
        set -e

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ -f "$OUT_PATH" ] && [ "${SF_FORMAT}" = "json" ]; then
          bash "${SF_ACTION_PATH}/scripts/emit-scan-warnings.sh" "$OUT_PATH" || true
        fi

        if [ -f "$OUT_PATH" ]; then
          if COUNT=$(bash "${SF_ACTION_PATH}/scripts/count-findings.sh" "${SF_FORMAT}" "$OUT_PATH"); then
            echo "findings-count=$COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::failed to count findings in ${OUT_PATH}"
            echo "findings-count=-1" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "findings-count=0" >> "$GITHUB_OUTPUT"
        fi

        exit $EXIT_CODE
