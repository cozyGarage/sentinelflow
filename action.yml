name: SentinelFlow Security Scan
description: Run SentinelFlow security scanning in your CI/CD pipeline
author: SentinelFlow

branding:
  icon: shield
  color: blue

inputs:
  delivery:
    description: How to obtain SentinelFlow — docker (pull image, recommended) or build (compile from caller workspace; same-repo only)
    required: false
    default: docker
  image:
    description: Container image when delivery=docker
    required: false
    default: sentinelflow/sentinelflow:latest
  scan-all:
    description: "Enable secrets/iac/deps/sast/license (does not enable container). Individual scan-*: false inputs opt out."
    required: false
    default: 'true'
  scan-secrets:
    description: Enable secret scanning
    required: false
    default: 'true'
  scan-iac:
    description: Enable Infrastructure-as-Code scanning
    required: false
    default: 'true'
  scan-deps:
    description: Enable dependency vulnerability scanning
    required: false
    default: 'true'
  scan-sast:
    description: Enable SAST scanning (OWASP patterns)
    required: false
    default: 'true'
  scan-license:
    description: Enable license policy scanning
    required: false
    default: 'true'
  scan-container:
    description: Enable container image scanning (requires Trivy)
    required: false
    default: 'false'
  container-image:
    description: Container image reference to scan
    required: false
    default: ''
  use-baseline:
    description: Apply baseline filtering (.sentinelflow/baseline.yaml)
    required: false
    default: 'false'
  fail-on:
    description: Fail on findings at or above this severity (critical, high, medium, low)
    required: false
    default: high
  format:
    description: Report output format (text, json, sarif, markdown, html)
    required: false
    default: sarif
  output:
    description: Output file path for the report
    required: false
    default: report.sarif
  working-directory:
    description: Directory to scan
    required: false
    default: '.'
  timeout:
    description: Scan deadline (Go duration, e.g. 10m, 90s); empty uses scan_timeout / default 10m
    required: false
    default: ''

outputs:
  findings-count:
    description: Total number of findings (from scan summary)
    value: ${{ steps.scan.outputs.findings-count }}
  exit-code:
    description: Exit code from the scan step
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Setup Go
      if: inputs.delivery == 'build'
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Build SentinelFlow
      if: inputs.delivery == 'build'
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        if [ ! -f go.mod ] || [ ! -d cmd/sentinelflow ]; then
          echo "delivery=build requires the SentinelFlow source tree in the workspace (same-repo dogfood)." >&2
          echo "For external repos use delivery=docker with image: sentinelflow/sentinelflow:<tag>." >&2
          exit 1
        fi
        go build -o sentinelflow ./cmd/sentinelflow
        ./sentinelflow version

    - name: Pull SentinelFlow image
      if: inputs.delivery != 'build'
      shell: bash
      env:
        SF_IMAGE: ${{ inputs.image }}
      run: |
        docker pull "${SF_IMAGE}"
        docker run --rm "${SF_IMAGE}" version

    - name: Install Trivy
      if: inputs.scan-container == 'true' && inputs.delivery == 'build'
      uses: aquasecurity/setup-trivy@v0.3.1

    - name: Guard container+docker delivery
      if: inputs.scan-container == 'true' && inputs.delivery != 'build'
      shell: bash
      run: |
        echo "scan-container requires delivery=build (Trivy runs on the host binary path)." >&2
        exit 1

    - name: Run security scan
      id: scan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SF_DELIVERY: ${{ inputs.delivery }}
        SF_IMAGE: ${{ inputs.image }}
        SF_SCAN_ALL: ${{ inputs.scan-all }}
        SF_SCAN_SECRETS: ${{ inputs.scan-secrets }}
        SF_SCAN_IAC: ${{ inputs.scan-iac }}
        SF_SCAN_DEPS: ${{ inputs.scan-deps }}
        SF_SCAN_SAST: ${{ inputs.scan-sast }}
        SF_SCAN_LICENSE: ${{ inputs.scan-license }}
        SF_SCAN_CONTAINER: ${{ inputs.scan-container }}
        SF_CONTAINER_IMAGE: ${{ inputs.container-image }}
        SF_USE_BASELINE: ${{ inputs.use-baseline }}
        SF_FAIL_ON: ${{ inputs.fail-on }}
        SF_FORMAT: ${{ inputs.format }}
        SF_OUTPUT: ${{ inputs.output }}
        SF_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SF_TIMEOUT: ${{ inputs.timeout }}
        SF_WORKSPACE: ${{ github.workspace }}
        SF_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        ARGS=()
        # scan-all enables the standard scanner set, but individual scan-*: false
        # inputs opt out (per-scanner false wins over scan-all).
        if [ "${SF_SCAN_ALL}" = "true" ]; then
          if [ "${SF_SCAN_SECRETS}" = "false" ] || [ "${SF_SCAN_IAC}" = "false" ] || \
             [ "${SF_SCAN_DEPS}" = "false" ] || [ "${SF_SCAN_SAST}" = "false" ] || \
             [ "${SF_SCAN_LICENSE}" = "false" ]; then
            [ "${SF_SCAN_SECRETS}" = "true" ] && ARGS+=(--secrets)
            [ "${SF_SCAN_IAC}" = "true" ] && ARGS+=(--iac)
            [ "${SF_SCAN_DEPS}" = "true" ] && ARGS+=(--deps)
            [ "${SF_SCAN_SAST}" = "true" ] && ARGS+=(--sast)
            [ "${SF_SCAN_LICENSE}" = "true" ] && ARGS+=(--license)
          else
            ARGS+=(--all)
          fi
        else
          [ "${SF_SCAN_SECRETS}" = "true" ] && ARGS+=(--secrets)
          [ "${SF_SCAN_IAC}" = "true" ] && ARGS+=(--iac)
          [ "${SF_SCAN_DEPS}" = "true" ] && ARGS+=(--deps)
          [ "${SF_SCAN_SAST}" = "true" ] && ARGS+=(--sast)
          [ "${SF_SCAN_LICENSE}" = "true" ] && ARGS+=(--license)
        fi

        if [ "${SF_SCAN_CONTAINER}" = "true" ]; then
          ARGS+=(--container)
          if [ -n "${SF_CONTAINER_IMAGE}" ]; then
            ARGS+=(--container-image "${SF_CONTAINER_IMAGE}")
          fi
        fi

        if [ "${SF_USE_BASELINE}" = "true" ]; then
          ARGS+=(--baseline)
        fi

        if [ -n "${SF_TIMEOUT}" ]; then
          ARGS+=(--timeout "${SF_TIMEOUT}")
        fi

        OUT_PATH="${SF_WORKSPACE}/${SF_OUTPUT}"
        WORK_DIR="${SF_WORKING_DIRECTORY}"
        if [ -z "${WORK_DIR}" ] || [ "${WORK_DIR}" = "." ]; then
          DOCKER_WORKDIR="/workspace"
        else
          DOCKER_WORKDIR="/workspace/${WORK_DIR}"
        fi

        set +e
        if [ "${SF_DELIVERY}" = "build" ]; then
          SF="${SF_WORKSPACE}/sentinelflow"
          "$SF" scan "${ARGS[@]}" \
            --fail-on "${SF_FAIL_ON}" \
            --format "${SF_FORMAT}" \
            -o "${OUT_PATH}"
          EXIT_CODE=$?
        else
          docker run --rm \
            -v "${SF_WORKSPACE}:/workspace" \
            -w "${DOCKER_WORKDIR}" \
            "${SF_IMAGE}" \
            scan "${ARGS[@]}" \
              --fail-on "${SF_FAIL_ON}" \
              --format "${SF_FORMAT}" \
              -o "/workspace/${SF_OUTPUT}"
          EXIT_CODE=$?
        fi
        set -e

        echo "exit-code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        if [ -f "$OUT_PATH" ]; then
          COUNT=$(bash "${SF_ACTION_PATH}/scripts/count-findings.sh" "${SF_FORMAT}" "$OUT_PATH" || echo 0)
          echo "findings-count=$COUNT" >> "$GITHUB_OUTPUT"
        else
          echo "findings-count=0" >> "$GITHUB_OUTPUT"
        fi

        exit $EXIT_CODE
