name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      # Docker Hub is optional: without DOCKER_USERNAME/PASSWORD we still publish
      # GitHub Release binaries + checksums.txt (install.sh path).
      - name: Detect Docker Hub credentials
        id: docker
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Docker Hub credentials present — will publish images."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Docker Hub secrets missing — publishing GitHub Release assets only (--skip=docker)."
          fi

      - name: Docker Login
        if: steps.docker.outputs.enabled == 'true'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        if: steps.docker.outputs.enabled == 'true'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        if: steps.docker.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@9c156ee8a17a598857849441385a2041ef570552 # v6.3.0
        with:
          distribution: goreleaser
          # Pin GoReleaser CLI (not "latest") for reproducible releases.
          version: v2.9.0
          args: ${{ steps.docker.outputs.enabled == 'true' && 'release --clean' || 'release --clean --skip=docker' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Attest checksums (SLSA provenance)
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: dist/checksums.txt

      - name: SBOM + self-scan release binaries
        run: |
          set -euo pipefail
          BIN="$(find dist -type f -name sentinelflow | head -n1)"
          if [ -z "${BIN}" ]; then
            echo "no sentinelflow binary under dist/" >&2
            exit 1
          fi
          "${BIN}" sbom --sbom-format cyclonedx -o dist/sbom.cdx.json
          "${BIN}" sbom --sbom-format spdx -o dist/sbom.spdx.json
          "${BIN}" scan-artifact "${BIN}" --fail-on critical --format json -o dist/artifact-scan.json || true

      - name: Upload extra release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            dist/checksums.txt.sig \
            dist/checksums.txt.pem \
            dist/sbom.cdx.json \
            dist/sbom.spdx.json \
            dist/artifact-scan.json \
            --clobber

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: dist/*
