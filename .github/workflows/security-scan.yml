name: SentinelFlow Security Scan

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

      - name: Run SentinelFlow scan
        uses: ./
        with:
          delivery: build
          scan-all: 'true'
          fail-on: high
          format: sarif
          output: report.sarif
          emit-annotations: 'true'
          pr-comment: 'true'

      - name: Upload SARIF to GitHub Security
        if: always() && hashFiles('report.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        continue-on-error: true
        with:
          sarif_file: report.sarif
          category: sentinelflow

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build SentinelFlow
        run: go build -o sentinelflow ./cmd/sentinelflow

      - name: Generate SBOM
        run: ./sentinelflow sbom -o sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          retention-days: 30

  policy-check:
    name: Policy Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build SentinelFlow
        run: go build -o sentinelflow ./cmd/sentinelflow

      - name: Validate built-in policies
        run: |
          for policy in policies/*.rego; do
            echo "Validating $policy"
            ./sentinelflow policy validate "$policy"
          done

      - name: Validate custom policies
        if: hashFiles('.sentinelflow/policies/*.rego') != ''
        run: |
          for policy in .sentinelflow/policies/*.rego; do
            echo "Validating $policy"
            ./sentinelflow policy validate "$policy"
          done
