name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Install checksum helper test
        run: bash scripts/install_checksum_test.sh

      - name: Findings count helper (json/sarif/text/junit/gitlab)
        run: |
          set -euo pipefail
          echo '{"findings":[]}' > /tmp/empty.json
          test "$(bash scripts/count-findings.sh json /tmp/empty.json)" = "0"
          printf '%s\n' '{"findings":[{"severity":"high"},{"severity":"low"}]}' > /tmp/two.json
          test "$(bash scripts/count-findings.sh json /tmp/two.json)" = "2"
          printf '%s\n' '{"runs":[{"results":[{"ruleId":"a"},{"ruleId":"b"},{"ruleId":"c"}]}]}' > /tmp/three.sarif
          test "$(bash scripts/count-findings.sh sarif /tmp/three.sarif)" = "3"
          printf '%s\n' 'Total Findings: 4' > /tmp/text.out
          test "$(bash scripts/count-findings.sh text /tmp/text.out)" = "4"
          printf '%s\n' '{"vulnerabilities":[{},{}]}' > /tmp/gl.json
          test "$(bash scripts/count-findings.sh gitlab-sast /tmp/gl.json)" = "2"
          printf '%s\n' '<?xml version="1.0"?><testsuite tests="1"><testcase name="a"><failure message="x"/></testcase></testsuite>' > /tmp/j.xml
          test "$(bash scripts/count-findings.sh junit /tmp/j.xml)" = "1"
