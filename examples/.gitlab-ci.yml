stages:
  - security

variables:
  GO_VERSION: "1.25"

.sentinelflow_build:
  before_script:
    - go build -o sentinelflow ./cmd/sentinelflow

sentinelflow-scan:
  stage: security
  image: golang:${GO_VERSION}
  extends: .sentinelflow_build
  script:
    - ./sentinelflow scan --all --format gitlab-sast -o gl-sast-report.json --fail-on high
    - ./sentinelflow scan --all --format markdown -o report.md || true
  artifacts:
    reports:
      sast: gl-sast-report.json
    paths:
      - report.md
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

sentinelflow-sbom:
  stage: security
  image: golang:${GO_VERSION}
  extends: .sentinelflow_build
  script:
    - ./sentinelflow sbom -o sbom.json
  artifacts:
    paths:
      - sbom.json
    expire_in: 30 days
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

sentinelflow-policy:
  stage: security
  image: golang:${GO_VERSION}
  extends: .sentinelflow_build
  script:
    - |
      for policy in policies/*.rego; do
        ./sentinelflow policy validate "$policy"
      done
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
