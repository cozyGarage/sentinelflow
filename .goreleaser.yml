# GoReleaser configuration for automated releases
version: 2

project_name: sentinelflow

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: sentinelflow
    binary: sentinelflow
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    main: ./cmd/sentinelflow

archives:
  - id: sentinelflow
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - policies/**/*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "typo"
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Security"
      regexp: '^.*?sec(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

dockers:
  - image_templates:
      - "sentinelflow/sentinelflow:{{ .Tag }}"
      - "sentinelflow/sentinelflow:v{{ .Major }}"
      - "sentinelflow/sentinelflow:v{{ .Major }}.{{ .Minor }}"
      - "sentinelflow/sentinelflow:latest"
    dockerfile: Dockerfile
    build_flag_templates:
      - "--pull"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
    extra_files:
      - policies

release:
  github:
    owner: cozyGarage
    name: sentinelflow
  draft: false
  # vX.Y.Z-rc.N tags become GitHub prereleases (never "Latest").
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"
  header: |
    ## SentinelFlow {{.Version}}

    CI/CD Security Gatekeeper — secret, IaC, dependency, SAST, and policy scanning for pipelines.

    ### Installation

    Binary (verifies `checksums.txt`):

    ```bash
    curl -fsSL https://raw.githubusercontent.com/cozyGarage/sentinelflow/main/scripts/install.sh | VERSION={{.Version}} bash
    ```

    GitHub Action:

    ```yaml
    - uses: cozyGarage/sentinelflow@{{.Tag}}
      with:
        delivery: release
        fail-on: high
    ```

    See CHANGELOG.md for upgrade notes. Docker images are published only when Docker Hub credentials are configured.
