version: "1.0"

scan_timeout: 10m

scanners:
  # Global path skips (all scanners / shared engine walk).
  # Secrets-only noise belongs under scanners.secrets.allowlist.
  exclude:
    - "test/**"
    - "examples/demo-project/**"
    - "**/testdata/**"
    - "**/*_test.go"
    - "**/*_bench_test.go"
    # Secrets scanner embeds intentional detector patterns that look like secrets.
    # SAST rules live in rules.yaml (not scanned). Keep secrets sources out of the walk.
    - "internal/scanner/secrets/scanner.go"
    - "internal/scanner/secrets/patterns_test.go"
    - "internal/scanner/iac/dockerfile.go"

  secrets:
    enabled: true
    allowlist:
      - "**/*_test.go"
      - "**/*_bench_test.go"

  iac:
    enabled: true

  dependencies:
    enabled: true
    # fail_on_error defaults to true (OSV/network errors fail CI).
    # Set false only to tolerate flaky networks; findings still apply fail_on.
    ignore_cves:
      # Indirect via OPA; openpgp subpackage is unmaintained — tracked upstream
      - GO-2026-5932
      # Indirect via OPA/otel; bump when OPA picks up a fixed otel release
      - GO-2026-5158

  sast:
    enabled: true

  license:
    enabled: true

policies:
  enabled: true

fail_on:
  severity: high
  secrets: true
  policy_violations: true
